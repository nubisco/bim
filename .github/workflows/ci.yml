name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, types, lint, format and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every export in the tests is validated with IfcOpenShell: the schema,
      # its rules and every shape. Pinned, so a new release cannot fail a pull
      # request that changed nothing.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install IfcOpenShell
        run: python -m pip install --quiet ifcopenshell==0.9.0.post1 pytest==9.2.0

      - run: pnpm run test
        env:
          IFC_PYTHON: python
      - run: pnpm run types:check
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
